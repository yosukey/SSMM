name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # FFmpeg is needed for the rotation test; the Qt libraries for the offscreen
      # platform plugin.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pytest ruff

      - name: Lint (pyflakes rules)
        run: ruff check --select F ssmm tests main.py

      - name: Run tests
        run: pytest -q tests
